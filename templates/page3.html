<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 3 - Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #52ad52 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #52ad52 0%, #347234 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background-color: #52ad52;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #288146;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="{{ url_for("staffData")}}" method="post">
        <h1>Statistics</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <!-- <div class="stat-number">2,547</div> stat-label-->
                <div class="stat-number">End Word: {{eWord}}</div>
            </div>
            <div class="stat-card">
                <!-- <div class="stat-number">12.5K</div> -->
                <div class="stat-number">Lecture Attendance: {{lectureAtten}}</div>
            </div>
            <div class="stat-card">
                <!-- <div class="stat-number">89%</div> -->
                <div class="stat-number">Leaderboard</div>
            </div>
            <div class="stat-card">
                <!-- <div class="stat-number">4.8</div> -->
                <div class="stat-number">Cover Again</div>
                <ul>
                  <li>{{Topic1}}</li>
                  <li>{{Topic2}}</li>
                  <li>{{Topic3}}</li>
                </ul>
            </div>
        </div>
        </form>


        <!--can you pull bruh-->
    </div>
</body>
</html>
