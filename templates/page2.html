<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #52ad52 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        p {
            color: #333;
            font-size: 18px;
            margin-bottom: 30px;
        }
        button {
            background-color: #288146;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #30573f;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #288146;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Word: {{sWord}}</p>
        <form action="{{ url_for("endLecture")}}" method="post">
            <button type="submit">End Lecture</button>
        </form>
        <form action="{{ url_for("back")}}" method="post">
            <div class="nav-link">← Back</div>
        </form>
    </div>

</body>
</html>
